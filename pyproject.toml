[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argos-security-platform"
version = "0.1.0"
description = "Adaptive Reconnaissance & Guard for Organizational Security — next-generation agentic security ecosystem"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "stacksry", email = "sridharreddyt@gmail.com" }]

dependencies = [
    # Core AI
    "anthropic>=0.40.0",

    # API & Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # Async infrastructure
    "aiokafka>=0.11.0",
    "redis[hiredis]>=5.0.0",
    "asyncpg>=0.29.0",

    # Databases
    "neo4j>=5.20.0",
    "qdrant-client[fastembed]>=1.9.0",

    # Data & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",

    # Git source control clients
    "httpx>=0.27.0",           # Bitbucket / GitHub REST calls

    # Code embeddings
    "sentence-transformers>=3.0.0",

    # Hardware analysis
    "PyVHDL>=0.1.0",           # VHDL parsing (best-effort, fallback gracefully)

    # BOM generation
    "cyclonedx-python-lib>=7.0.0",

    # Binary / firmware analysis (wrappers — tools must be installed separately)
    "python-magic>=0.4.27",    # file type detection for firmware

    # MCP server
    "mcp[cli]>=1.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",         # retry with backoff
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

hardware = [
    # Install separately — requires system deps
    # pip install argos-security-platform[hardware]
    "pyelftools>=0.31",        # ELF firmware parsing
    "capstone>=5.0.1",         # disassembly
]

[project.scripts]
argos = "argos.cli:main"
argos-api = "argos.api.server:app"
argos-worker = "argos.worker:main"
argos-mcp = "argos.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["argos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
